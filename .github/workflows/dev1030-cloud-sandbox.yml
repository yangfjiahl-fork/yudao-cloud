name: Dev1030 Cloud Sandbox Build

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests and package directly
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build yudao-server from dev1030
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout dev1030
        uses: actions/checkout@v4
        with:
          ref: dev1030
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        if: ${{ !inputs.skip_tests }}
        run: mvn -B -ntp clean verify -pl yudao-server -am

      - name: Build without tests
        if: ${{ inputs.skip_tests }}
        run: mvn -B -ntp clean package -pl yudao-server -am -DskipTests

      - name: Prepare artifact and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          source_jar="yudao-server/target/yudao-server.jar"
          test -f "${source_jar}"

          short_sha="$(git rev-parse --short=8 HEAD)"
          artifact_name="yudao-server-${short_sha}.jar"
          artifact_dir="${RUNNER_TEMP}/yudao-server-artifact"

          mkdir -p "${artifact_dir}"
          cp "${source_jar}" "${artifact_dir}/${artifact_name}"
          (
            cd "${artifact_dir}"
            sha256sum "${artifact_name}" > "${artifact_name}.sha256"
          )

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "artifact_dir=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yudao-server-${{ steps.artifact.outputs.short_sha }}
          path: ${{ steps.artifact.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 1
